# nginx in front of the admin app. Replace admin.example.com and the certificate paths.
# Based on the member app's deploy/nginx.conf; the differences are the server name, the upstream
# (port 3100), the optional IP allowlist and the robots.txt passthrough.
limit_req_zone $binary_remote_addr zone=admin_site:20m rate=30r/s;
# Server Actions (sign-in, 2-step codes, approvals) are POSTs: a tighter limit for them only.
map $request_method $admin_post_key { POST $binary_remote_addr; default ""; }
limit_req_zone $admin_post_key zone=admin_posts:20m rate=8r/s;
# Zone and upstream names are prefixed so this file can sit next to the member's in one nginx.

upstream chokprathan_admin {
  server app:3100;            # docker compose; use 127.0.0.1:3100 with PM2
  keepalive 64;
}

server {
  listen 80;
  server_name admin.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name admin.example.com;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  # HSTS, CSP, X-Frame-Options and X-Robots-Tag come from the app (next.config.ts); not repeated here.

  # Optional: only allow the office / VPN addresses (placeholders, uncomment and replace).
  # allow 203.0.113.10;
  # allow 198.51.100.0/24;
  # deny all;

  client_max_body_size 4m;     # Server Actions accept 3 MB (next.config.ts bodySizeLimit); banner uploads are at most 2 MB
  client_body_timeout 15s;
  client_header_timeout 15s;
  server_tokens off;
  limit_req_status 429;       # per server: a second http-level copy would clash with the member's file

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Crawlers may read the "Disallow: /" answer even when the allowlist above is on.
  location = /robots.txt {
    allow all;
    proxy_pass http://chokprathan_admin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /_next/static/ {
    proxy_pass http://chokprathan_admin;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    limit_req zone=admin_site burst=80 nodelay;
    limit_req zone=admin_posts burst=20 nodelay;
    proxy_pass http://chokprathan_admin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite (never append) so visitors cannot forge their address. Requires TRUST_PROXY=1.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
